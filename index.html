<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style>
<title>Vale de Èlia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Caveat+Brush&family=Jost:wght@400&display=swap" rel="stylesheet">
<style>
/* Una tarjeta crema vertical, centrada; un carrito invisible del que cuelga el bolso, nubes que pasan. Look único (papel), sin modo oscuro a propósito. */
:root{
  --paper:#F8F1E6; --cloud:#FCF8F1; --sage:#7D8B74; --sage-soft:#A9B5A0; --peach:#E5AE9B; --blush:#F2CFC2; --star:#EBCF95; --ink:#6B785F;
  --f-display:'Caveat Brush','Segoe Print','Bradley Hand',cursive;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --f-label:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-label);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.stage{min-height:100%;display:flex;justify-content:center;align-items:center;padding-inline:16px;padding-block:20px}
.card{position:relative;width:100%;max-width:440px;min-height:min(780px,calc(100dvh - 40px));overflow:hidden;
  display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 22px 34px;gap:0}
.card::before{content:"";position:absolute;inset:8px;border:1.5px solid var(--sage-soft);border-radius:3px;pointer-events:none}

/* cielo de fondo */
.sky{position:absolute;inset:0;pointer-events:none;z-index:0}
.drift{position:absolute;left:0;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
.star{position:absolute;width:10px;height:10px;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}

.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}
.kicker{font-size:13px;letter-spacing:.42em;padding-left:.42em;color:var(--sage)}
.kicker-line{margin-top:8px}
h1{margin:22px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(42px,12.5vw,56px);line-height:1;color:var(--sage);text-wrap:balance}
.name{font-family:var(--f-hand);font-size:clamp(44px,13vw,58px);line-height:1;color:var(--peach);margin-top:6px;display:flex;align-items:center;gap:8px}
.name svg{width:.62em;height:.62em;animation:beat 1.6s ease-in-out infinite;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(.96)}45%{transform:scale(1.1)}}

/* carrito + bolso */
.stroller{position:relative;width:100%;height:300px;margin-top:22px}
.bar{position:absolute;top:34px;left:6%;right:6%;height:12px;border-radius:12px;background:var(--sage-soft);z-index:3;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.bar::before,.bar::after{content:"";position:absolute;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--sage)}
.bar::before{left:-6px}.bar::after{right:-6px}
.bag{position:absolute;top:6px;left:50%;width:290px;margin-left:-145px;transform-origin:50% 8%;z-index:2;cursor:pointer;border:0;background:none;padding:0}
.bag img{display:block;width:100%;filter:drop-shadow(0 12px 14px rgba(110,100,80,.2))}
.bag:focus-visible{outline:2px dashed var(--peach);outline-offset:4px;border-radius:8px}
.hint{position:absolute;bottom:-4px;left:0;right:0;font-family:var(--f-hand);font-size:20px;color:var(--sage-soft)}

.msg{font-family:var(--f-hand);font-size:clamp(25px,7vw,30px);line-height:1.15;color:var(--ink);margin-top:22px;max-width:26ch;text-wrap:balance}
.foot{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:30px;font-size:11px;letter-spacing:.22em;color:var(--sage)}
.foot span{display:flex;flex-direction:column;align-items:center;gap:9px}
.foot i{width:1.5px;height:44px;background:var(--sage-soft)}

/* corazones */
.heart{position:absolute;pointer-events:none;z-index:20;width:18px;height:18px;animation:float 1.6s ease-out forwards}
@keyframes float{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-170px) scale(1.1) rotate(var(--r))}}

/* animaciones de entrada (solo tras abrir) */
.opened .in{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.opened .bag{animation:drop 2.8s cubic-bezier(.3,.7,.3,1) both .5s}
@keyframes drop{0%{transform:translateY(-140%) rotate(0)}28%{transform:translateY(0) rotate(9deg)}44%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}88%{transform:rotate(1deg)}100%{transform:rotate(0)}}
.opened .bag.settled{animation:none}
.opened .bag.settled.swing,.bag.swing{animation:swing 1.4s ease-out}
@keyframes swing{0%{transform:rotate(0)}20%{transform:rotate(-7deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.sleepy-cloud{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* portada: la nube que hay que tocar */
.cover{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding-inline:16px;text-align:center;cursor:pointer;border:0;width:100%;font:inherit;color:inherit;transition:opacity .7s ease .55s}
.cover:focus-visible{outline:none}
.cover:focus-visible .big-cloud{filter:drop-shadow(0 0 0 var(--peach)) drop-shadow(0 0 6px var(--peach))}
.cover .small{font-size:12px;letter-spacing:.42em;padding-left:.42em;color:var(--sage)}
.cover .q{font-family:var(--f-hand);font-size:clamp(30px,8.5vw,40px);color:var(--ink);line-height:1.1}
.cover .tap{font-family:var(--f-hand);font-size:22px;color:var(--peach);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.big-cloud{width:min(280px,72vw);animation:bob 3.4s ease-in-out infinite;overflow:visible}
.cover .eyes-open{opacity:0}
.cover.waking .eyes-open{opacity:1}.cover.waking .eyes-closed{opacity:0}
.cover.waking .big-cloud{animation:poof .9s cubic-bezier(.5,0,.6,1) forwards .35s}
@keyframes poof{0%{transform:scale(1)}30%{transform:scale(.9,1.08)}100%{transform:scale(2.6);opacity:0}}
.cover.waking .tap,.cover.waking .q,.cover.waking .small{transition:opacity .3s;opacity:0}
.cover.gone{opacity:0;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .cover.gone{display:none}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="rough" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <symbol id="cloud" viewBox="-6 -6 152 92"><path d="M30 70 A18 18 0 0 1 28 36 A26 26 0 0 1 78 27 A20 20 0 0 1 112 47 A15 15 0 0 1 108 70 A22 10 0 0 1 70 76 A22 10 0 0 1 30 70 Z" fill="#FCF8F1" stroke="#A9B5A0" stroke-width="2.4" stroke-linejoin="round"/></symbol>
    <symbol id="star" viewBox="0 0 20 20"><path d="M10 1 L12.4 7.6 L19 10 L12.4 12.4 L10 19 L7.6 12.4 L1 10 L7.6 7.6 Z" fill="#EBCF95"/></symbol>
    <symbol id="heart" viewBox="0 0 24 22"><path d="M12 20 C5 15 2 11.5 2 7.5 A5 5 0 0 1 12 5 A5 5 0 0 1 22 7.5 C22 11.5 19 15 12 20 Z" fill="currentColor"/></symbol>
  </defs>
</svg>

<button class="cover" id="cover" type="button" aria-label="Abrir el regalo">
  <span class="small">PARA ÈLIA</span>
  <svg class="big-cloud" viewBox="-6 -6 152 92" filter="url(#rough)" aria-hidden="true">
    <use href="#cloud" x="-6" y="-6" width="152" height="92"/>
    <g class="eyes-closed" stroke="#7D8B74" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M56 56 q5 4 10 0 M76 56 q5 4 10 0"/></g>
    <g class="eyes-open" fill="#7D8B74"><circle cx="61" cy="55" r="2.8"/><circle cx="81" cy="55" r="2.8"/><path d="M66 63 q5 4 10 0" stroke="#7D8B74" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    <circle cx="51" cy="63" r="4" fill="#F2CFC2"/><circle cx="91" cy="63" r="4" fill="#F2CFC2"/>
  </svg>
  <span class="q">Una nube trae algo<br>para ti…</span>
  <span class="tap">toca la nube</span>
</button>

<main class="stage">
  <section class="card" id="card">
    <div class="sky" aria-hidden="true">
      <svg class="drift" style="top:150px;animation-duration:38s;animation-delay:-12s" width="96" height="58"><use href="#cloud" width="96" height="58"/></svg>
      <svg class="drift" style="top:430px;animation-duration:52s;animation-delay:-30s" width="130" height="78"><use href="#cloud" width="130" height="78"/></svg>
      <svg class="drift" style="top:610px;animation-duration:44s;animation-delay:-5s" width="80" height="48"><use href="#cloud" width="80" height="48"/></svg>
      <svg class="star" style="top:40px;left:14%;animation-delay:-.4s"><use href="#star"/></svg>
      <svg class="star" style="top:70px;right:16%;animation-delay:-1.5s"><use href="#star"/></svg>
      <svg class="star" style="top:270px;left:9%;animation-delay:-2.3s"><use href="#star"/></svg>
      <svg class="star" style="top:320px;right:10%;animation-delay:-.9s"><use href="#star"/></svg>
      <svg class="star" style="bottom:120px;left:12%;animation-delay:-1.9s"><use href="#star"/></svg>
      <svg class="star" style="bottom:150px;right:13%;animation-delay:-2.8s"><use href="#star"/></svg>
    </div>

    <div class="content">
      <div class="kicker in" style="animation-delay:.1s">VALE REGALO</div>
      <svg class="kicker-line in" style="animation-delay:.15s" width="120" height="10" aria-hidden="true"><path d="M3 6 Q60 1 117 5" stroke="#E5AE9B" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      <h1 class="in" style="animation-delay:.25s">Bienvenida al mundo</h1>
      <div class="name in" style="animation-delay:.4s">Èlia <svg aria-hidden="true" style="color:var(--peach)"><use href="#heart"/></svg></div>

      <div class="stroller">
        <svg class="sleepy-cloud in" style="position:absolute;top:150px;left:-10px;animation-delay:1.6s;z-index:4" width="104" height="62" filter="url(#rough)" aria-hidden="true">
          <use href="#cloud" width="104" height="62"/>
          <path d="M38 42 q4 3.4 8 0 M54 42 q4 3.4 8 0" stroke="#7D8B74" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <circle cx="34" cy="48" r="3.4" fill="#F2CFC2"/><circle cx="66" cy="48" r="3.4" fill="#F2CFC2"/>
        </svg>

<script>
(function(){
  var cover=document.getElementById('cover'), card=document.getElementById('card'), bag=document.getElementById('bag');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var colors=['#E5AE9B','#F2CFC2','#A9B5A0','#EBCF95'];

  function hearts(x,y,n){
    if(reduce) return;
    for(var i=0;i<n;i++){
      var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
      s.setAttribute('class','heart');
      s.innerHTML='<use href="#heart"/>';
      s.style.left=(x-9+(Math.random()*40-20))+'px';
      s.style.top=(y-9+(Math.random()*20-10))+'px';
      s.style.color=colors[i%colors.length];
      s.style.setProperty('--dx',(Math.random()*160-80)+'px');
      s.style.setProperty('--r',(Math.random()*60-30)+'deg');
      s.style.animationDelay=(i*0.06)+'s';
      var sz=12+Math.random()*14; s.style.width=s.style.height=sz+'px';
      document.body.appendChild(s);
      setTimeout(function(el){el.remove()},2200,s);
    }
  }

  function open(){
    if(cover.classList.contains('waking')) return;
    var r=cover.querySelector('.big-cloud').getBoundingClientRect();
    cover.classList.add('waking');
    hearts(r.left+r.width/2, r.top+r.height/2, 14);
    setTimeout(function(){ card.classList.add('opened'); cover.classList.add('gone'); }, reduce?0:650);
    setTimeout(function(){ cover.hidden=true; }, reduce?0:1500);
  }
  cover.addEventListener('click',open);

  bag.addEventListener('click',function(e){
    bag.classList.remove('swing'); void bag.offsetWidth;
    bag.classList.add('swing');
    var r=bag.getBoundingClientRect();
    hearts(e.clientX||r.left+r.width/2, e.clientY||r.top+r.height/3, 9);
  });
  bag.addEventListener('animationend',function(){ bag.classList.add('settled'); bag.classList.remove('swing'); });
})();
</script>
